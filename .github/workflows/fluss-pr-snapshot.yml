name: Fluss PR Snapshot
run-name: 'PR #${{ inputs.pull_request_number }} / ${{ inputs.publication_mode }}'

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request number
        required: true
        type: number
      publication_mode:
        description: Publish a PR Snapshot or run a local publication preflight
        type: choice
        default: pr-snapshot
        options:
          - pr-snapshot
          - preflight

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fluss-pr-snapshot-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve PR source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      rocksdb_version: ${{ steps.resolve.outputs.rocksdb_version }}
      source_repository: ${{ steps.resolve.outputs.source_repository }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve and validate PR source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR_NUMBER: ${{ inputs.pull_request_number }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/fluss-main ]]; then
            echo "PR publication workflows must run from fluss-main" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR_NUMBER" \
            > "$RUNNER_TEMP/pull-request.json"
          base_sha=$(jq -er '.base.sha' "$RUNNER_TEMP/pull-request.json")
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request base SHA" >&2
            exit 1
          fi
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/include/rocksdb/version.h?ref=$base_sha" \
            > "$RUNNER_TEMP/base-version.h"

          rocksdb_version=$(awk '
            /#define ROCKSDB_MAJOR/ { major = $3 }
            /#define ROCKSDB_MINOR/ { minor = $3 }
            /#define ROCKSDB_PATCH/ { patch = $3 }
            END { print major "." minor "." patch }
          ' "$RUNNER_TEMP/base-version.h")

          .github/scripts/prepare-pr-snapshot.sh \
            "$RUNNER_TEMP/pull-request.json" \
            "$rocksdb_version" \
            "$GITHUB_OUTPUT" \
            "$RUNNER_TEMP/pr-snapshot-manifest.json"

      - name: Summarize PR source
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: |
          {
            printf 'PR source: `%s`\n\n' "$SOURCE_SHA"
            printf 'Mode: `%s`\n\n' "$PUBLICATION_MODE"
            printf 'Maven component: `io.github.fluss-contrib:fluss-rocksdbjni:%s`\n' "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: fluss-pr-snapshot-source
          path: ${{ runner.temp }}/pr-snapshot-manifest.json
          if-no-files-found: error

  publication:
    name: Run PR publication workflow
    needs: resolve
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/fluss-jni-publish.yml
    with:
      publication_mode: ${{ inputs.publication_mode }}
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      rocksdb_version: ${{ needs.resolve.outputs.rocksdb_version }}
      source_repository: ${{ needs.resolve.outputs.source_repository }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
    secrets: inherit
